spring.application.name=admin-app
server.port=8082

# Conexion directa a la BD del motor Flowable (Postgres del docker).
# OJO: es la base 'flowable' (tablas ACT_*), NO la base 'institucion'.
# La app corre en el host, por eso localhost (no el nombre 'postgres' del compose).
spring.datasource.url=jdbc:postgresql://localhost:5432/flowable
spring.datasource.username=flowable
spring.datasource.password=flow123
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo gestiona el motor del docker: esta app NO crea ni migra tablas.
flowable.database-schema-update=false
# Esta app no debe ejecutar jobs del motor, solo consultar y operar tareas.
flowable.async-executor-activate=false
# El deploy de definiciones es responsabilidad del motor, no de esta app.
flowable.check-process-definitions=false

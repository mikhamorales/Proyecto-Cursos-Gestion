spring.application.name=web-app
server.port=8081

# Conexion a Flowable (API REST dentro del contenedor)
# API de proceso: iniciar instancias, consultar tareas, etc.
flowable.rest.base-url=http://localhost:8080/flowable-ui/process-api
# API de identidad/UI: validar credenciales de usuarios
flowable.rest.ui-base-url=http://localhost:8080/flowable-ui/api
flowable.rest.username=admin
flowable.rest.password=test

# Nombre del mensaje BPMN que inicia el formulario de clientes (start event de mensaje)
flowable.process-start-message=Solicitud de curso

# Usuario que ve el panel de simulacion de mensajes
flowable.admin.username=admin

# Roles administrativos (se determinan por nombre de usuario)
flowable.rol.jefe-administrativo=jefeAdmin
flowable.rol.administrativos=admin1,admin2
flowable.rol.docentes=docente1,docente2
flowable.rol.jefe-docente=jefeDocente

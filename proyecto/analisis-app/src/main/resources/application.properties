spring.application.name=analisis-app
server.port=8084

# API REST de historial de Flowable. Los valores por defecto se pueden
# reemplazar con variables de entorno, sin tocar el codigo.
flowable.rest.base-url=${FLOWABLE_REST_URL:http://localhost:8080/flowable-ui/process-api}
flowable.rest.username=${FLOWABLE_REST_USER:admin}
flowable.rest.password=${FLOWABLE_REST_PASSWORD:test}
flowable.process-key=${FLOWABLE_PROCESS_KEY:process}

# Nombres de actividades del BPMN usados para medir la preparacion paralela.
# Se comparan con activityName (y con activityId si no hay nombre).
# "Preparacion completa" es la compuerta que marca el fin de las tres ramas.
analisis.preparacion.fin=Preparacion completa
analisis.preparacion.inscripciones=Recibir nomina,Confeccionar lista definitiva
analisis.preparacion.materiales=Preparar materiales
analisis.preparacion.recursos=Evaluar recursos,Reservar aula,Solicitar aula virtual,Contratar equipamiento

# Usuarios que se listan en la distribucion de tareas, aunque tengan 0.
analisis.roles.administrativos=jefeAdmin,admin1,admin2
analisis.roles.docentes=jefeDocente,docente1,docente2

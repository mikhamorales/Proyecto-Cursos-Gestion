spring.application.name=docente-app
server.port=8083

# API REST del motor Flowable. El compose publica 8080, no el puerto de
# Postgres, por eso la app NO usa JDBC: habla con process-api por HTTP.
# Los valores se pueden sobrescribir con variables de entorno.
flowable.rest.base-url=${FLOWABLE_REST_URL:http://localhost:8080/flowable-ui/process-api}
flowable.rest.username=${FLOWABLE_REST_USER:admin}
flowable.rest.password=${FLOWABLE_REST_PASSWORD:test}

# Roles del equipo docente. El login exige pertenencia al grupo 'docentes'
# del IDM; el jefe se identifica por su nombre de usuario.
flowable.rol.jefe-docente=jefeDocente
flowable.rol.docentes=docente1,docente2
